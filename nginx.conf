# Bore Connect Nginx Reverse Proxy
# 用法: nginx -c "C:/Users/De'l'l/Desktop/bore-connect-backend-main/nginx.conf"

worker_processes 2;
worker_rlimit_nofile 4096;

events {
    worker_connections 1024;
    use select;  # Windows 下使用 select
}

http {
    include       "c:/Users/De'l'l/Desktop/bore-connect-backend-main/nginx-portable/nginx-1.26.3/conf/mime.types";
    default_type  application/octet-stream;

    # ── 日志 ──
    access_log  logs/access.log;
    error_log   logs/error.log  warn;

    # ── 基础优化 ──
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size 10m;

    # ── Gzip 压缩 ──
    gzip on;
    gzip_vary on;
    gzip_comp_level 4;
    gzip_min_length 256;
    gzip_types
        application/json
        application/javascript
        text/css
        text/plain
        text/xml
        application/xml
        image/svg+xml;

    # ── 后端连接池 ──
    upstream bore_backend {
        server 127.0.0.1:8000;
        keepalive 32;  # 保持长连接，复用 TCP 连接
    }

    # ── 限流：每 IP 最多 20 个并发连接 ──
    limit_conn_zone $binary_remote_addr zone=per_ip:10m;
    limit_conn per_ip 20;

    # ── 请求速率限制：每 IP 每秒最多 500 个请求（压测放开） ──
    limit_req_zone $binary_remote_addr zone=api_rate:10m rate=500r/s;

    server {
        listen 9090;  # 用 9090 避免与 80/8080 端口冲突
        server_name localhost;

        # ── 静态文件：直接由 Nginx 服务（不经过 Python） ──
        location /assets/ {
            alias "C:/Users/De'l'l/Desktop/bore-connect-backend-main/app/static/assets/";
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── 静态首页 ──
        location = / {
            alias "C:/Users/De'l'l/Desktop/bore-connect-backend-main/app/static/";
            try_files /index.html =404;
        }

        location = /favicon.ico {
            alias "C:/Users/De'l'l/Desktop/bore-connect-backend-main/app/static/";
            try_files /favicon.ico =404;
            access_log off;
        }

        # ── API 反向代理到 FastAPI ──
        location /api/ {
            limit_req zone=api_rate burst=20 nodelay;
            proxy_pass http://bore_backend;
            proxy_http_version 1.1;

            # 长连接复用
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 流式响应必须关闭缓冲（聊天接口 NDJSON 流）
            proxy_buffering off;

            # 超时设置（LLM 调用可能比较慢）
            proxy_connect_timeout 10s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # ── 其他静态资源的 fallback ──
        location / {
            alias "C:/Users/De'l'l/Desktop/bore-connect-backend-main/app/static/";
            try_files $uri $uri/ /index.html;
        }
    }
}
